<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooms — Campus Social AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="rooms">

<div class="page-shell two-col">
  <div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0;">💬 Campus Rooms</h2>
      <button class="btn btn-primary btn-sm" onclick="document.getElementById('createBox').classList.toggle('hidden-box')">+ New Room</button>
    </div>
    <div id="createBox" class="card hidden-box" style="margin-bottom:16px;">
      <label>Title</label><input type="text" id="rTitle" placeholder="Late Night Tea">
      <label>Topic</label>
      <select id="rTopic">
        <option value="tea">Late Night Tea</option><option value="study">Study Session</option>
        <option value="coding">Coding Help</option><option value="gaming">Gaming Room</option>
        <option value="music">Music Discussion</option><option value="sports">Sports Discussion</option>
      </select>
      <button class="btn btn-primary btn-block" style="margin-top:12px;" id="createRoomBtn">Create Room</button>
    </div>
    <div id="roomsList"></div>
  </div>

  <div class="card" id="chatPanel" style="display:none; height:fit-content;">
    <h3 id="chatTitle"></h3>
    <div id="chatMessages" style="max-height:340px; overflow-y:auto; margin-bottom:10px;"></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <input type="text" id="chatInput" placeholder="Type a message...">
    </div>
    <label style="display:flex; align-items:center; gap:6px; margin-top:8px;">
      <input type="checkbox" id="chatAnon" style="width:auto;"> Send anonymously
    </label>
    <button class="btn btn-primary btn-block" id="sendChatBtn" style="margin-top:8px;">Send</button>
  </div>
</div>

<style>.hidden-box { display: none; }</style>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
let activeRoomId = null;
let pollTimer = null;

document.getElementById("createRoomBtn").addEventListener("click", async () => {
  const title = document.getElementById("rTitle").value.trim();
  if (!title) return showToast("Title required.");
  try {
    await api("/api/rooms", { method: "POST", body: { title, topic: document.getElementById("rTopic").value } });
    document.getElementById("createBox").classList.add("hidden-box");
    loadRooms();
  } catch (err) { showToast(err.message); }
});

function roomCardHtml(r) {
  return `<div class="card interactive fade-in" style="margin-bottom:10px; cursor:pointer;" data-room="${r.id}" data-title="${escapeHtml(r.title)}">
    <div style="display:flex; justify-content:space-between;">
      <b>${escapeHtml(r.title)}</b>
      <span class="category-badge">${escapeHtml(r.topic)}</span>
    </div>
    <span style="font-size:0.78rem; color:var(--text-faint);">${r.member_count} members</span>
  </div>`;
}

async function loadRooms() {
  try {
    const rooms = await api("/api/rooms");
    document.getElementById("roomsList").innerHTML = rooms.length
      ? rooms.map(roomCardHtml).join("")
      : `<div class="empty-state"><div class="icon">💬</div>No active rooms. Start one!</div>`;
    document.querySelectorAll("[data-room]").forEach(el => {
      el.addEventListener("click", () => openRoom(el.dataset.room, el.dataset.title));
    });
  } catch (err) { showToast(err.message); }
}

async function openRoom(roomId, title) {
  activeRoomId = roomId;
  await api(`/api/rooms/${roomId}/join`, { method: "POST" }).catch(() => {});
  document.getElementById("chatPanel").style.display = "block";
  document.getElementById("chatTitle").textContent = title;
  await loadMessages();
  clearInterval(pollTimer);
  pollTimer = setInterval(loadMessages, 4000);
}

async function loadMessages() {
  if (!activeRoomId) return;
  const messages = await api(`/api/rooms/${activeRoomId}/messages`);
  document.getElementById("chatMessages").innerHTML = messages.map(m =>
    `<div style="margin-bottom:6px; font-size:0.85rem;"><b>${escapeHtml(m.author_display)}:</b> ${escapeHtml(m.text)}</div>`
  ).join("") || `<div style="color:var(--text-faint); font-size:0.85rem;">No messages yet.</div>`;
}

document.getElementById("sendChatBtn").addEventListener("click", async () => {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text || !activeRoomId) return;
  await api(`/api/rooms/${activeRoomId}/messages`, { method: "POST", body: { text, is_anonymous: document.getElementById("chatAnon").checked } });
  input.value = "";
  loadMessages();
});

loadRooms();
</script>
</body>
</html>
